[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-slice"
version = "0.1.0"
description = "Automatically detect and slice song segments from VTuber karaoke/VOD archives."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Your Name" }
]
keywords = [
  "vtuber",
  "karaoke",
  "video",
  "audio",
  "ffmpeg",
  "whisper",
  "clipping",
  "neuro-sama"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent"
]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<14.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "faster-whisper>=1.0.3,<2.0",
  "openai>=1.40,<2.0",
  "numpy>=1.26,<3.0"
]

[project.optional-dependencies]
audio = [
  "librosa>=0.10.2,<1.0",
  "soundfile>=0.12.1,<1.0"
]
gpu = [
  "nvidia-cuda-runtime-cu12>=12.9,<13.0",
  "nvidia-cublas-cu12>=12.9,<13.0",
  "nvidia-cudnn-cu12>=9.0,<10.0"
]
web = [
  "PySide6>=6.7,<7.0",
  "pyqtdarktheme>=2.1,<3.0"
]

[dependency-groups]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5.0,<1.0",
  "mypy>=1.10,<2.0"
]

[project.urls]
Homepage = "https://github.com/yourname/Neuro-slice"
Repository = "https://github.com/yourname/Neuro-slice"
Issues = "https://github.com/yourname/Neuro-slice/issues"

[project.scripts]
neuro-slice = "neuro_slice.cli:app"

[tool.uv]
package = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
pretty = true
mypy_path = "src"